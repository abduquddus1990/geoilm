name: GeoIlm hikoya (2 kunda 1)

on:
  schedule:
    - cron: "37 12 */2 * *"   # har 2 kunda, 17:37 Toshkent vaqti
  workflow_dispatch:

permissions:
  contents: write

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: quiz_generator/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          pip install -r requirements.txt
          npm ci --prefix quiz_generator
          npx --prefix quiz_generator playwright install --with-deps chromium
      - name: Navbatdagi hikoyani yasash va yuborish
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: python run_quiz.py --mode hikoya --only telegram
      - if: always()
        run: |
          git config user.name "geoilm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/used.json
          git diff --cached --quiet || (git commit -m "hikoya: used.json" && git push)
