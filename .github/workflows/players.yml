name: Futbolchilar bazasini yangilash (Wikidata)

on:
  schedule:
    - cron: "0 2 1 * *"     # har oyning 1-kuni, 07:00 Toshkent
  workflow_dispatch:

permissions:
  contents: write

jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python tools/fetch_players.py --limit 200 --uz
      - run: |
          git config user.name "geoilm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/players_auto.json
          git diff --cached --quiet || (git commit -m "players_auto.json yangilandi" && git push)
