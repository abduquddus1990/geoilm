<!doctype html>
<!-- GeoIlm: "Bu qaysi futbolchi?" — klublar yo'li bo'yicha viktorina. Ma'lumot quiz.js (window.QUIZ) dan. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Hand;src:url(node_modules/@fontsource/caveat/files/caveat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F,U+2018-201F;}
@font-face{font-family:Hand;src:url(node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2) format('woff2');}
html,body{margin:0;background:#fbf8ef;overflow:hidden} svg{display:block}
</style></head><body>
<svg id="s" width="720" height="1280" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
<defs><radialGradient id="vig" cx="50%" cy="48%" r="72%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#3c4a20" stop-opacity=".18"/></radialGradient></defs>
<rect width="720" height="1280" fill="#eef4ea"/>
<g id="pitch" opacity=".55"></g>
<image id="noise" width="720" height="1280" opacity=".35"/>
<g id="cards"></g><g id="ui"></g>
<rect width="720" height="1280" fill="url(#vig)"/>
</svg>
<script src="node_modules/roughjs/bundled/rough.js"></script>
<script src="quiz.js"></script>
<script>
const Q=window.QUIZ, LIST=Q.items, INK='#24305e', NS='http://www.w3.org/2000/svg';
const LEVEL_COLOR={'oson':'#1f8a5a','o‘rtacha':'#c98a12','qiyin':'#c0392b'};
const svg=document.getElementById('s'), rc=rough.svg(svg);
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
function flag(a2){ if(a2==='ENG') return '\u{1F3F4}\u{E0067}\u{E0062}\u{E0065}\u{E006E}\u{E0067}\u{E007F}';
  return String.fromCodePoint(...[...a2.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65)); }
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
function text(x,y,s,size,o={},p=ui){const t=el('text',{x,y,'font-family':o.font||'Hand','font-size':size,'font-weight':700,fill:o.color||INK,'text-anchor':o.anchor||'middle'},p);t.textContent=s;return t;}
const FLAG_CODE={ENG:'gb-eng',SCT:'gb-sct',WLS:'gb-wls'};
function flagImg(parent,cx,cy,h,a2){
  const code=FLAG_CODE[a2]||a2.toLowerCase(), w=h*4/3;
  el('image',{href:`node_modules/flag-icons/flags/4x3/${code}.svg`,x:cx-w/2,y:cy-h/2,width:w,height:h,preserveAspectRatio:'none'},parent);
  el('rect',{x:cx-w/2,y:cy-h/2,width:w,height:h,fill:'none',stroke:INK,'stroke-width':1.5,rx:3},parent);
}
let seed=5; const R=o=>Object.assign({stroke:INK,strokeWidth:2.2,roughness:1.3,seed:seed++},o);
const ui=document.getElementById('ui'), cardsG=document.getElementById('cards');
// qog'oz donadorligi
(()=>{const c=document.createElement('canvas');c.width=720;c.height=1280;const x=c.getContext('2d');const im=x.createImageData(720,1280);
 let s=999;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<im.data.length;i+=4){im.data[i]=70;im.data[i+1]=80;im.data[i+2]=45;im.data[i+3]=Math.min(40,Math.abs(rnd()-rnd())*60);}
 x.putImageData(im,0,0);document.getElementById('noise').setAttribute('href',c.toDataURL());})();
// futbol maydoni eskizi (fon)
(()=>{const P=document.getElementById('pitch'), o={stroke:'#6f9a6a',strokeWidth:2.4,roughness:1.6};
 [[40,40,640,1200],[200,40,320,170],[270,40,180,70],[200,1070,320,170],[270,1170,180,70]].forEach((r,k)=>P.appendChild(rc.rectangle(...r,{...o,seed:50+k})));
 P.appendChild(rc.line(40,640,680,640,{...o,seed:60})); P.appendChild(rc.circle(360,640,190,{...o,seed:61}));})();
// sarlavha
const header=el('g',{},ui);
header.appendChild(rc.rectangle(110,50,500,160,R({fill:'#fffdf6',fillStyle:'solid',strokeWidth:2.4})));
text(360,122,Q.title||'Bu qaysi futbolchi?',64,{},header);
header.appendChild(rc.line(170,138,550,142,R({stroke:'#c0392b',strokeWidth:3})));
text(360,170,'klublari bo‘yicha toping',30,{color:'#5a6390'},header);
const levelTxt=text(360,200,'',30,{},header);
const counter=text(640,1235,'',34,{color:'#4b5a3a'});
text(150,1235,Q.handle||'@geoilm',32,{color:'#4b5a3a'});
// taymer
const timerG=el('g',{},ui);
el('circle',{cx:120,cy:1120,r:54,fill:'#fffdf6',stroke:'#c9c0ad','stroke-width':6},timerG);
const timerArc=el('circle',{cx:120,cy:1120,r:54,fill:'none','stroke-width':8,'stroke-linecap':'round',transform:'rotate(-90 120 1120)'},timerG);
const timerNum=text(120,1146,'3',72,{},timerG);
const ARC=2*Math.PI*54; timerArc.setAttribute('stroke-dasharray',ARC);
// vaqt jadvali
const INTRO=0.6, OUTRO=2.6, STEP=0.38, CD=3, REVT=1.5;
let T=INTRO; const TL=LIST.map(it=>{const n=it.clubs.length, s=T, build=0.3+n*STEP, cd=s+build+0.3, rev=cd+CD, end=rev+REVT; T=end; return {s,cd,rev,end};});
window.DURATION=T+OUTRO;
window.EVENTS=LIST.map((it,i)=>({start:TL[i].s,cd:TL[i].cd,rev:TL[i].rev,level:it.level,levelChange:i>0&&LIST[i-1].level!==it.level}));
// har savol uchun kartochkalar guruhi
const groups=LIST.map((it,i)=>{
  const g=el('g',{opacity:0},cardsG), n=it.clubs.length;
  const avail=1000-255, h=Math.min(92,avail/n-16), gap=Math.min(44,(avail-n*h)/Math.max(1,n)), top=255+(avail-(n*h+(n-1)*gap))/2;
  const maxLen=Math.max(...it.clubs.map(c=>c[1].length)); const fs=Math.min(n<=5?46:n<=7?40:32, 330/(maxLen*0.45));
  const cards=it.clubs.map(([f,club,yrs],k)=>{
    const y=top+k*(h+gap), cg=el('g',{opacity:0},g);
    cg.appendChild(rc.rectangle(95,y,530,h,R({fill:'#fffdf6',fillStyle:'solid',strokeWidth:2.3,seed:500+i*20+k})));
    flagImg(cg,142,y+h/2,Math.min(h*.55,fs*.8),f);
    text(185,y+h/2+fs*.33,club,fs,{anchor:'start'},cg);
    text(605,y+h/2+fs*.28,yrs,fs*.62,{anchor:'end',color:'#6b7396'},cg);
    if(k<n-1){ cg.appendChild(rc.line(360,y+h+3,360,y+h+gap-3,R({strokeWidth:2,stroke:'#8a93b5'}))); }
    return {cg,y,h};
  });
  // javob
  const rev=el('g',{opacity:0},g), name=it.name, w=Math.min(640,Math.max(360,name.length*30+160));
  rev.appendChild(rc.rectangle(360-w/2,1035,w,120,R({fill:'#fffdf6',fillStyle:'solid',strokeWidth:2.6,seed:700+i})));
  text(395,1118,name,name.length>16?54:66,{},rev);
  flagImg(rev,360-w/2+62,1095,42,it.nat);
  return {g,cards,rev};
});
// yakun
const outro=el('g',{opacity:0},ui);
outro.appendChild(rc.rectangle(90,470,540,300,R({fill:'#fffdf6',fillStyle:'solid',strokeWidth:2.8,seed:999})));
text(360,560,'Nechtasini topdingiz?',62,{},outro);
text(360,650,'Izohda yozing 👇',56,{color:'#c0392b'},outro);
text(360,725,'Obuna bo‘ling — ertaga yangisi!',38,{color:'#5a6390'},outro);
window.render=function(t){
  const N=LIST.length; let i=TL.findIndex(x=>t>=x.s&&t<x.end);
  groups.forEach(g=>g.g.setAttribute('opacity',0)); timerG.setAttribute('opacity',0);
  if(i>=0){const tl=TL[i], G=groups[i], lt=t-tl.s, fade=ease((tl.end-t)/.25);
    G.g.setAttribute('opacity',fade);
    G.cards.forEach((c,k)=>{const r=ease((lt-0.3-k*STEP)/.25); c.cg.setAttribute('opacity',r);
      const sc=.92+.08*r; c.cg.setAttribute('transform',`translate(360 ${c.y+c.h/2}) scale(${sc}) translate(-360 ${-(c.y+c.h/2)})`);});
    const cd=t-tl.cd; if(cd>=0&&t<tl.rev){timerG.setAttribute('opacity',1); const n=3-Math.floor(cd), fr=cd%1; timerNum.textContent=n;
      timerArc.setAttribute('stroke',n===3?'#1f8a5a':n===2?'#e0a21b':'#d9534f'); timerArc.setAttribute('stroke-dashoffset',ARC*fr);
      const sc=1+.12*Math.max(0,1-fr*5); timerG.setAttribute('transform',`translate(120 1120) scale(${sc}) translate(-120 -1120)`);}
    const r=ease((t-tl.rev)/.25); G.rev.setAttribute('opacity',r); const sc=.85+.15*r; G.rev.setAttribute('transform',`translate(360 1095) scale(${sc}) translate(-360 -1095)`);
    const lv=LIST[i].level; levelTxt.textContent='Daraja: '+lv; levelTxt.setAttribute('fill',LEVEL_COLOR[lv]||INK);
    counter.textContent=(i+1)+'/'+N; outro.setAttribute('opacity',0);
  } else { counter.textContent=''; const lt=t-TL[N-1].end; outro.setAttribute('opacity',t>=TL[N-1].end?ease(lt/.4):0);
    levelTxt.textContent=t<INTRO?'Daraja: '+LIST[0].level:''; levelTxt.setAttribute('fill',LEVEL_COLOR[LIST[0].level]); }
};
document.fonts.load('700 48px Hand','Aö‘ń').then(()=>{render(0);window.READY=true;});
</script></body></html>
