<!doctype html>
<!-- GeoIlm: 3D globus viktorinasi — globus aylanib davlatga uchadi. Ma'lumot quiz.js (window.QUIZ) dan. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-ext-800-normal.woff2) format('woff2');unicode-range:U+0100-024F,U+2018-201F;}
@font-face{font-family:M;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2) format('woff2');}
@font-face{font-family:M;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F,U+2018-201F;}
@font-face{font-family:M;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2) format('woff2');}
html,body{margin:0;background:#050b1a;overflow:hidden} svg{display:block}
</style></head><body>
<svg id="s" width="720" height="1280" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="space" cx="50%" cy="45%" r="80%"><stop offset="0%" stop-color="#132a52"/><stop offset="60%" stop-color="#081430"/><stop offset="100%" stop-color="#03070f"/></radialGradient>
  <radialGradient id="ocean" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#3f8fd8"/><stop offset="55%" stop-color="#1c5aa6"/><stop offset="100%" stop-color="#0b2d63"/></radialGradient>
  <radialGradient id="shade" cx="35%" cy="30%" r="75%"><stop offset="45%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000814" stop-opacity=".55"/></radialGradient>
  <radialGradient id="atmo" cx="50%" cy="50%" r="50%"><stop offset="86%" stop-color="#6fc3ff" stop-opacity="0"/><stop offset="90%" stop-color="#6fc3ff" stop-opacity=".3"/><stop offset="100%" stop-color="#6fc3ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="spec" cx="32%" cy="26%" r="30%"><stop offset="0%" stop-color="#fff" stop-opacity=".22"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  <clipPath id="clipG"><circle id="clipC" cx="360" cy="640" r="300"/></clipPath>
</defs>
<rect width="720" height="1280" fill="url(#space)"/>
<g id="stars"></g>
<circle id="atmoC" cx="360" cy="640" r="345" fill="url(#atmo)"/>
<circle id="oceanC" cx="360" cy="640" r="300" fill="url(#ocean)"/>
<g clip-path="url(#clipG)">
  <path id="grat" fill="none" stroke="#9fd0ff" stroke-opacity=".18" stroke-width="1"/>
  <g id="lands"></g>
  <path id="borders" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width=".8" stroke-linejoin="round"/>
  <g id="hl"></g>
</g>
<circle id="shadeC" cx="360" cy="640" r="300" fill="url(#shade)" pointer-events="none"/>
<circle id="specC" cx="360" cy="640" r="300" fill="url(#spec)" pointer-events="none"/>
<g id="ui"></g>
</svg>
<script src="node_modules/d3/dist/d3.min.js"></script>
<script src="node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script src="node_modules/world-atlas/world.js"></script>
<script src="quiz.js"></script>
<script>
const Q=window.QUIZ, LIST=Q.items, NS='http://www.w3.org/2000/svg';
const LEVEL_COLOR={'oson':'#46d39a','o‘rtacha':'#ffc94d','qiyin':'#ff6b6b'};
const HL=['#ffcf3f','#ff7a59','#7cf29c','#ff6fd8','#5ee7ff','#ffa94d'];
const LANDPAL=['#e9dcb8','#d7e4b5','#efd2b0','#d9d3e8','#cfe3d0','#ead7c8','#e2e6c2'];
const INTRO=1.6, PER=5.4, OUTRO=2.8, T_FLY=1.5, T_CD0=1.6, T_REV=4.6;
const CX=360, CY=640;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
const ui=document.getElementById('ui');
function text(x,y,s,size,o={},p=ui){const t=el('text',{x,y,'font-family':'M','font-weight':o.w||800,'font-size':size,fill:o.color||'#fff','text-anchor':o.anchor||'middle'},p);t.textContent=s;return t;}
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
// yulduzlar
(()=>{const g=document.getElementById('stars');let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<220;i++) el('circle',{cx:r()*720,cy:r()*1280,r:r()<.9?r()*1.1+.3:r()*1.8+.8,fill:'#fff',opacity:.25+r()*.6},g);})();
// geodata
const feats=topojson.feature(WORLD,WORLD.objects.countries).features;
const mesh=topojson.mesh(WORLD,WORLD.objects.countries,(a,b)=>a!==b);
const byId={}; feats.forEach(f=>{const o=byId[f.id]; if(!o||d3.geoArea(f)>d3.geoArea(o)) byId[f.id]=f;});
function mainGeom(f){const g=f.geometry; if(g.type!=='MultiPolygon') return f;
  const ps=g.coordinates.map(c=>({type:'Polygon',coordinates:c})).map(p=>({p,a:d3.geoArea(p),c:d3.geoCentroid(p)}));
  const big=ps.reduce((a,b)=>b.a>a.a?b:a);
  const keep=ps.filter(q=>d3.geoDistance(q.c,big.c)*6371<1800&&(q.a>big.a*.015||d3.geoDistance(q.c,big.c)*6371<600));
  return {type:'Feature',geometry:{type:'MultiPolygon',coordinates:keep.map(q=>q.p.coordinates)}};}
const proj=d3.geoOrthographic().translate([CX,CY]).clipAngle(90).precision(.4), path=d3.geoPath(proj);
const grat=d3.geoGraticule10();
const targets=LIST.map(it=>{const g=mainGeom(byId[it.id]); const c=d3.geoCentroid(g);
  // zoom: globusning radiusi shunday tanlanadiki, davlat ekranning ~40% ini egallasin (300..1400 oralig'ida)
  const ang=Math.max(.02, d3.geoBounds(g).reduce((a,b)=>a)[0]!==undefined? d3.geoDistance(d3.geoBounds(g)[0],d3.geoBounds(g)[1])/2 : .1);
  const R=Math.max(300, Math.min(1000, 125/Math.sin(Math.min(ang,1.2))));
  return {c,R};});
const START={c:[40,25],R:300};
// qatlamlar
const landsG=document.getElementById('lands'), hl=document.getElementById('hl');
const landPaths=feats.map((f,j)=>el('path',{fill:LANDPAL[(+f.id||j)%LANDPAL.length],'fill-opacity':.96},landsG));
const bord=document.getElementById('borders'), gratP=document.getElementById('grat');
const circles=['clipC','oceanC','shadeC','specC'].map(id=>document.getElementById(id)), atmoC=document.getElementById('atmoC');
let hlPath=el('path',{fill:'#ffcf3f',stroke:'#fff','stroke-width':2.5,filter:'url(#glow)'},hl);
const pulse=el('circle',{fill:'none',stroke:'#fff','stroke-width':3,opacity:0},hl);
// UI: sarlavha
const hdr=el('g',{},ui);
el('rect',{x:70,y:70,width:580,height:150,rx:28,fill:'#0b1a3a','fill-opacity':.72,stroke:'#6fc3ff','stroke-opacity':.5,'stroke-width':2},hdr);
text(360,145,Q.title||'Bu qaysi davlat?',54,{},hdr);
const lvl=text(360,192,'',28,{w:700},hdr);
const counter=text(650,1235,'',30,{w:700,color:'#9fc4ff',anchor:'end'});
text(70,1235,Q.handle||'@geoilm',30,{w:700,color:'#9fc4ff',anchor:'start'});
// taymer
const tg=el('g',{},ui); const TX=360, TY=1060, TR=58;
el('circle',{cx:TX,cy:TY,r:TR,fill:'#0b1a3a','fill-opacity':.8,stroke:'#ffffff','stroke-opacity':.2,'stroke-width':8},tg);
const tarc=el('circle',{cx:TX,cy:TY,r:TR,fill:'none','stroke-width':9,'stroke-linecap':'round',transform:`rotate(-90 ${TX} ${TY})`},tg);
const tnum=text(TX,TY+24,'3',68,{},tg); const ARC=2*Math.PI*TR; tarc.setAttribute('stroke-dasharray',ARC);
// javob
const FLAG={ENG:'gb-eng'}; const CAP=Q.mode==='capital';
// poytaxt rejimi: davlat yorlig'i (savol paytida) va poytaxt belgisi
const clabs=LIST.map((it,i)=>{ if(!CAP) return null; const g=el('g',{opacity:0},ui);
  const fs=it.name.length>14?34:40, w=Math.min(600,Math.max(300,it.name.length*fs*.62+130));
  el('rect',{x:360-w/2,y:245,width:w,height:84,rx:22,fill:'#0b1a3a','fill-opacity':.8,stroke:'#ffffff','stroke-opacity':.35,'stroke-width':2},g);
  el('image',{href:`node_modules/flag-icons/flags/4x3/${(FLAG[it.a2]||it.a2.toLowerCase())}.svg`,x:360-w/2+22,y:266,width:56,height:42,preserveAspectRatio:'none'},g);
  text((360-w/2+92+360+w/2-18)/2,301,it.name,fs,{},g); return g;});
const capG=el('g',{opacity:0},document.getElementById('hl'));
const capStar=el('path',{d:'M0,-22 L6,-7 L22,-7 L9,3 L14,19 L0,9 L-14,19 L-9,3 L-22,-7 L-6,-7 Z',fill:'#ffd84d',stroke:'#fff','stroke-width':2.5,filter:'url(#glow)'},capG);
const capRing=el('circle',{r:30,fill:'none',stroke:'#ffd84d','stroke-width':3},capG);
const revs=LIST.map((it,i)=>{const g=el('g',{opacity:0},ui); const nm=CAP?it.cap:it.name; const fs=nm.length>14?42:52, w=Math.min(660,Math.max(380,nm.length*fs*.62+150));
  el('rect',{x:360-w/2,y:1000,width:w,height:120,rx:26,fill:'#0b1a3a','fill-opacity':.85,stroke:HL[i%HL.length],'stroke-width':3},g);
  const code=FLAG[it.a2]||it.a2.toLowerCase();
  el('image',{href:`node_modules/flag-icons/flags/4x3/${code}.svg`,x:360-w/2+28,y:1036,width:64,height:48,preserveAspectRatio:'none'},g);
  text((360-w/2+110+360+w/2-24)/2,1080,nm,fs,{},g); return g;});
// yakun
const outro=el('g',{opacity:0},ui);
el('rect',{x:80,y:930,width:560,height:250,rx:30,fill:'#0b1a3a','fill-opacity':.85,stroke:'#6fc3ff','stroke-opacity':.6,'stroke-width':2},outro);
text(360,1010,'Nechtasini topdingiz?',44,{},outro);
text(360,1075,'Izohda yozing 👇',40,{color:'#ffcf3f'},outro);
text(360,1135,'Obuna bo‘ling — ertaga yangisi!',28,{w:700,color:'#9fc4ff'},outro);

function setGlobe(c,R){
  proj.rotate([-c[0],-c[1]]).scale(R);
  circles.forEach(cc=>cc.setAttribute('r',R)); atmoC.setAttribute('r',R*1.15);
  gratP.setAttribute('d',path(grat));
  feats.forEach((f,j)=>landPaths[j].setAttribute('d',path(f)||''));
  bord.setAttribute('d',path(mesh)||'');
}
function lerpCam(a,b,t){const e=eio(t), ip=d3.geoInterpolate(a.c,b.c);
  const dist=d3.geoDistance(a.c,b.c); const out=Math.min(.55,dist*.35+.15);
  const R=Math.exp(Math.log(a.R)+(Math.log(b.R)-Math.log(a.R))*e)*(1-out*Math.sin(Math.PI*e));
  return {c:ip(e),R};}
window.render=function(t){
  const N=LIST.length; let i=-1, lt=0, cam;
  if(t<INTRO){cam={c:[START.c[0]+t*12,START.c[1]],R:300};}
  else if(t<INTRO+PER*N-1e-6){i=Math.min(N-1,Math.floor((t-INTRO)/PER)); lt=t-INTRO-i*PER;
    const prev=i===0?{c:[START.c[0]+INTRO*12,START.c[1]],R:300}:targets[i-1];
    cam=lt<T_FLY?lerpCam(prev,targets[i],lt/T_FLY):{c:[targets[i].c[0]+(lt-T_FLY)*.6,targets[i].c[1]],R:targets[i].R};}
  else {i=N; lt=t-INTRO-PER*N; const last=targets[N-1]; const k=ease(lt/1.2);
    cam={c:[last.c[0]+lt*14,last.c[1]],R:last.R+(300-last.R)*k};}
  setGlobe(cam.c,cam.R);
  revs.forEach(g=>g.setAttribute('opacity',0)); tg.setAttribute('opacity',0);
  if(i>=0&&i<N){
    const f=byId[LIST[i].id]; hlPath.setAttribute('d',path(f)||''); hlPath.setAttribute('fill',HL[i%HL.length]);
    const a=ease((lt-T_FLY+.25)/.5); hlPath.setAttribute('opacity',a);
    const pc=proj(d3.geoCentroid(mainGeom(f))); const ph=((lt-T_FLY)%1.2)/1.2;
    if(pc&&lt>T_FLY){pulse.setAttribute('cx',pc[0]);pulse.setAttribute('cy',pc[1]);pulse.setAttribute('r',20+ph*90);pulse.setAttribute('opacity',(1-ph)*.7*a);} else pulse.setAttribute('opacity',0);
    const cd=lt-T_CD0; if(cd>=0&&lt<T_REV){tg.setAttribute('opacity',1); const n=3-Math.floor(cd), fr=cd%1; tnum.textContent=n;
      tarc.setAttribute('stroke',n===3?'#46d39a':n===2?'#ffc94d':'#ff6b6b'); tarc.setAttribute('stroke-dashoffset',ARC*fr);
      const sc=1+.12*Math.max(0,1-fr*5); tg.setAttribute('transform',`translate(${TX} ${TY}) scale(${sc}) translate(${-TX} ${-TY})`);}
    if(CAP){ clabs.forEach(g=>g.setAttribute('opacity',0)); clabs[i].setAttribute('opacity',ease((lt-T_FLY+.2)/.35)*ease((PER-lt)/.2));
      const p=proj([LIST[i].lon,LIST[i].lat]); const r=ease((lt-T_REV)/.3);
      if(p&&lt>=T_REV){capG.setAttribute('opacity',r*ease((PER-lt)/.2)); capStar.setAttribute('transform',`translate(${p[0]} ${p[1]}) scale(${.6+.4*r})`);
        capRing.setAttribute('cx',p[0]); capRing.setAttribute('cy',p[1]); capRing.setAttribute('r',30+30*(1-r));} else capG.setAttribute('opacity',0); }
    if(lt>=T_REV){const r=ease((lt-T_REV)/.25); revs[i].setAttribute('opacity',r*ease((PER-lt)/.2));
      const sc=.85+.15*r; revs[i].setAttribute('transform',`translate(360 1060) scale(${sc}) translate(-360 -1060)`);}
    const lv=LIST[i].level; lvl.textContent=Q.subtitle||('Daraja: '+lv); lvl.setAttribute('fill',LEVEL_COLOR[lv]||'#fff');
    counter.textContent=(i+1)+'/'+N; outro.setAttribute('opacity',0);
  } else {
    hlPath.setAttribute('opacity',0); pulse.setAttribute('opacity',0); counter.textContent=''; capG.setAttribute('opacity',0); clabs.forEach(g=>g&&g.setAttribute('opacity',0));
    outro.setAttribute('opacity',i>=N?ease(lt/.4):0);
    lvl.textContent=i<0?(Q.subtitle||'Daraja: '+LIST[0].level):''; lvl.setAttribute('fill',LEVEL_COLOR[LIST[0].level]||'#fff');
  }
};
window.DURATION=INTRO+PER*LIST.length+OUTRO;
window.EVENTS=LIST.map((it,i)=>({start:INTRO+i*PER,cd:INTRO+i*PER+T_CD0,rev:INTRO+i*PER+T_REV,level:it.level,levelChange:i>0&&LIST[i-1].level!==it.level}));
Promise.all([document.fonts.load('800 48px M','Ao‘'),document.fonts.load('700 28px M','Ao‘')]).then(()=>{render(0);window.READY=true;});
</script></body></html>
