<!doctype html>
<!-- GeoIlm: "Bu qaysi davlat?" daftar uslubidagi viktorina. Savollar quiz.js (window.QUIZ) dan olinadi. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Hand;src:url(node_modules/@fontsource/caveat/files/caveat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F,U+2018-201F;}
@font-face{font-family:Hand;src:url(node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2) format('woff2');}
html,body{margin:0;background:#fbf8ef;overflow:hidden}
svg{display:block}
</style></head><body>
<svg id="s" width="720" height="1280" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#8fb3dc" stroke-width=".8" opacity=".55"/></pattern>
  <pattern id="sea" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="9" stroke="#5f8fcc" stroke-width="1.1" opacity=".38"/></pattern>
  <filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter>
  <radialGradient id="vig" cx="50%" cy="48%" r="72%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#4a3c20" stop-opacity=".2"/></radialGradient>
</defs>
<rect width="720" height="1280" fill="#fbf8ef"/>
<rect width="720" height="1280" fill="url(#sea)"/>
<g id="map" filter="url(#wob)"><path id="land" fill="#fffdf7"/><path id="borders" fill="none" stroke="#2c3b75" stroke-width="1.2" stroke-linejoin="round"/></g>
<rect width="720" height="1280" fill="url(#grid)"/>
<line x1="62" y1="0" x2="62" y2="1280" stroke="#d9534f" stroke-width="1.6" opacity=".55"/>
<g id="hl"></g>
<image id="noise" width="720" height="1280" opacity=".55"/>
<g id="ui"></g>
<rect width="720" height="1280" fill="url(#vig)"/>
</svg>
<script src="node_modules/d3/dist/d3.min.js"></script>
<script src="node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script src="node_modules/roughjs/bundled/rough.js"></script>
<script src="node_modules/world-atlas/world.js"></script>
<script src="quiz.js"></script>
<script>
const Q=window.QUIZ, INK='#24305e', NS='http://www.w3.org/2000/svg';
const LIST=Q.items; // [{id,a2,name,level}]
const LEVEL_COLOR={'oson':'#1f8a5a','o‘rtacha':'#c98a12','qiyin':'#c0392b'};
const COLORS=['#7b3fa0','#c0392b','#1f7a5a','#b5651d','#2e5aa8','#a0306b'];
const INTRO=1.2, PER=5.2, OUTRO=2.6, T_FLY=1.0, T_DRAW0=0.9, T_DRAW1=2.0, T_CD0=1.1, T_REV=4.1;
const flag=a2=>String.fromCodePoint(...[...a2.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65));
// qog'oz donadorligi (noise) — canvas orqali
(()=>{const c=document.createElement('canvas');c.width=720;c.height=1280;const x=c.getContext('2d');const im=x.createImageData(720,1280);
 let s=12345;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<im.data.length;i+=4){im.data[i]=90;im.data[i+1]=75;im.data[i+2]=45;im.data[i+3]=Math.min(40,Math.abs(rnd()-rnd())*60);}
 x.putImageData(im,0,0);document.getElementById('noise').setAttribute('href',c.toDataURL());})();
const svg=document.getElementById('s'), rc=rough.svg(svg);
const feats=topojson.feature(WORLD,WORLD.objects.countries).features;
const mesh=topojson.mesh(WORLD,WORLD.objects.countries);
const landAll={type:'FeatureCollection',features:feats};
const byId={}; feats.forEach(f=>{const o=byId[f.id]; if(!o||d3.geoArea(f)>d3.geoArea(o)) byId[f.id]=f;});
function frameGeom(f){ // uzoqdagi orollar/hududlarni kadrlashdan chiqarish
  const g=f.geometry; if(g.type!=='MultiPolygon') return f;
  const polys=g.coordinates.map(c=>({type:'Polygon',coordinates:c})).map(p=>({p,a:d3.geoArea(p),c:d3.geoCentroid(p)}));
  const big=polys.reduce((a,b)=>b.a>a.a?b:a);
  const keep=polys.filter(q=>{const km=d3.geoDistance(q.c,big.c)*6371; return km<1800&&(q.a>big.a*0.015||km<600);});
  return {type:'Feature',geometry:{type:'MultiPolygon',coordinates:keep.map(q=>q.p.coordinates)}};
}
const CX=360, CY=640;
function camFor(f){
  const p=d3.geoMercator().scale(1).translate([0,0]); const b=d3.geoPath(p).bounds(frameGeom(f));
  const w=b[1][0]-b[0][0], h=b[1][1]-b[0][1];
  return {s:Math.min(470/w,520/h), c:p.invert([(b[0][0]+b[1][0])/2,(b[0][1]+b[1][1])/2])};
}
const cams=LIST.map(it=>camFor(byId[it.id]));
const worldCam={s:150,c:[60,30]};
const proj=d3.geoMercator().translate([CX,CY]), path=d3.geoPath(proj);
const landEl=document.getElementById('land'), bordEl=document.getElementById('borders'), hl=document.getElementById('hl'), ui=document.getElementById('ui');
const setCam=c=>proj.scale(c.s).center(c.c);
function lerpCam(a,b,t){
  const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  let dl=b.c[0]-a.c[0]; if(dl>180)dl-=360; if(dl<-180)dl+=360;
  const ls=Math.log(a.s)+(Math.log(b.s)-Math.log(a.s))*e;
  const dip=1-0.45*Math.sin(Math.PI*e)*Math.min(1,Math.abs(Math.log(b.s/a.s))+.6);
  return {s:Math.exp(ls)*dip,c:[a.c[0]+dl*e,a.c[1]+(b.c[1]-a.c[1])*e]};
}
function el(tag,attrs,parent=ui){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}
function text(x,y,str,size,o={},parent=ui){const t=el('text',{x,y,'font-family':o.font||'Hand','font-size':size,'font-weight':700,fill:o.color||INK,'text-anchor':'middle'},parent);t.textContent=str;return t;}
let seed=11; const R=o=>Object.assign({stroke:INK,strokeWidth:2.2,roughness:1.3,seed:seed++},o);
// sarlavha
const header=el('g',{});
header.appendChild(rc.rectangle(110,60,500,150,R({fill:'#fffdf6',fillStyle:'solid',strokeWidth:2.4})));
text(360,138,Q.title||'Bu qaysi davlat?',70,{},header);
header.appendChild(rc.line(190,154,530,158,R({stroke:'#c0392b',strokeWidth:3})));
const levelTxt=text(360,194,'',34,{},header);
const counter=text(640,1235,'',34,{color:'#5a6390'});
const handle=text(150,1235,Q.handle||'@geoilm',32,{color:'#5a6390'});
// taymer
const timerG=el('g',{});
el('circle',{cx:120,cy:1120,r:54,fill:'#fffdf6',stroke:'#c9c0ad','stroke-width':6},timerG);
const timerArc=el('circle',{cx:120,cy:1120,r:54,fill:'none','stroke-width':8,'stroke-linecap':'round',transform:'rotate(-90 120 1120)'},timerG);
const timerNum=text(120,1146,'3',72,{},timerG);
const ARC=2*Math.PI*54; timerArc.setAttribute('stroke-dasharray',ARC);
// javob yorlig'i
const revG=el('g',{}); const revCache={};
function revealFor(i){
  if(revCache[i]) return revCache[i];
  const g=el('g',{opacity:0},revG), name=LIST[i].name;
  const w=Math.min(640,Math.max(330,name.length*32+150));
  g.appendChild(rc.rectangle(360-w/2,1035,w,120,R({fill:'#fffdf6',fillStyle:'solid',strokeWidth:2.6,seed:100+i})));
  text(395,1118,name,name.length>14?58:72,{},g);
  const f=el('text',{x:360-w/2+60,y:1114,'font-size':54,'text-anchor':'middle','font-family':'Noto Color Emoji, Segoe UI Emoji, Apple Color Emoji'},g); f.textContent=flag(LIST[i].a2);
  return revCache[i]=g;
}
// yakun
const outro=el('g',{opacity:0});
outro.appendChild(rc.rectangle(90,470,540,300,R({fill:'#fffdf6',fillStyle:'solid',strokeWidth:2.8,seed:999})));
text(360,560,'Nechtasini topding?',64,{},outro);
text(360,650,'Izohda yoz 👇',58,{color:'#c0392b'},outro);
text(360,725,'Obuna bo‘ling — ertaga yangisi!',38,{color:'#5a6390'},outro);
// ajratilgan davlat
let hlCache={idx:-1};
function buildHL(i){
  hl.innerHTML=''; setCam(cams[i]);
  const d=path(byId[LIST[i].id]), col=COLORS[i%COLORS.length];
  const solid=el('path',{d,fill:col,opacity:0},hl);
  const g=rc.path(d,{stroke:INK,strokeWidth:2.6,roughness:.9,bowing:.6,fill:col,fillStyle:'hachure',hachureGap:5.5,fillWeight:2.2,hachureAngle:-41+i*13,seed:200+i});
  hl.appendChild(g);
  const units=[...g.querySelectorAll('path')].map(p=>{const L=p.getTotalLength()||1;p.style.strokeDasharray=L+' '+L;return{p,L};});
  let tot=units.reduce((a,u)=>a+u.L,0),acc=0; units.forEach(u=>{u.a=acc/tot;acc+=u.L;u.b=acc/tot;});
  hlCache={idx:i,units,solid};
}
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
let lastKey='';
window.render=function(t){
  let cam,i=-1,lt=0; const N=LIST.length;
  if(t<INTRO) cam=worldCam;
  else if(t<INTRO+PER*N-1e-6){i=Math.min(N-1,Math.floor((t-INTRO)/PER)); lt=t-INTRO-i*PER;
    cam=lt<T_FLY?lerpCam(i===0?worldCam:cams[i-1],cams[i],lt/T_FLY):cams[i];}
  else {cam=cams[N-1]; i=N; lt=t-INTRO-PER*N;}
  setCam(cam);
  const key=cam.s.toFixed(3)+','+cam.c[0].toFixed(4)+','+cam.c[1].toFixed(4);
  if(key!==lastKey){lastKey=key; landEl.setAttribute('d',path(landAll)); bordEl.setAttribute('d',path(mesh));}
  Object.values(revCache).forEach(g=>g.setAttribute('opacity',0));
  if(i>=0&&i<N){
    if(hlCache.idx!==i) buildHL(i);
    hl.style.display=lt>=T_FLY-0.05?'':'none';
    const k=Math.min(1,Math.max(0,(lt-T_DRAW0)/(T_DRAW1-T_DRAW0)));
    hlCache.units.forEach(u=>{const q=k<=u.a?0:k>=u.b?1:(k-u.a)/(u.b-u.a);u.p.style.strokeDashoffset=u.L*(1-q);});
    hlCache.solid.setAttribute('opacity',.18*ease((lt-T_DRAW0)/.6));
    const cd=lt-T_CD0, on=cd>=0&&lt<T_REV; timerG.setAttribute('opacity',on?1:0);
    if(on){const n=3-Math.floor(cd), fr=cd%1; timerNum.textContent=n;
      timerArc.setAttribute('stroke',n===3?'#1f8a5a':n===2?'#e0a21b':'#d9534f');
      timerArc.setAttribute('stroke-dashoffset',ARC*fr); const sc=1+.12*Math.max(0,1-fr*5);
      timerG.setAttribute('transform',`translate(120 1120) scale(${sc}) translate(-120 -1120)`);}
    if(lt>=T_REV){const g=revealFor(i), r=ease((lt-T_REV)/.25); g.setAttribute('opacity',r*ease((PER-lt)/.2));
      const sc=.85+.15*r; g.setAttribute('transform',`translate(360 1095) scale(${sc}) translate(-360 -1095)`);}
    const lv=LIST[i].level; levelTxt.textContent='Daraja: '+lv; levelTxt.setAttribute('fill',LEVEL_COLOR[lv]||INK);
    counter.textContent=(i+1)+'/'+N; outro.setAttribute('opacity',0);
  } else {
    hl.style.display=i>=N?'':'none'; timerG.setAttribute('opacity',0);
    outro.setAttribute('opacity',i>=N?ease(lt/.4):0); counter.textContent='';
    levelTxt.textContent=i<0?'Daraja: '+LIST[0].level:''; levelTxt.setAttribute('fill',LEVEL_COLOR[LIST[0].level]);
  }
};
window.DURATION=INTRO+PER*LIST.length+OUTRO;
window.EVENTS=LIST.map((it,i)=>({start:INTRO+i*PER,cd:INTRO+i*PER+T_CD0,rev:INTRO+i*PER+T_REV,level:it.level,
  levelChange:i>0&&LIST[i-1].level!==it.level}));
Promise.all([document.fonts.load('700 48px Hand','Ao‘')]).then(()=>{LIST.forEach((_,i)=>revealFor(i));render(0);window.READY=true;});
</script></body></html>
